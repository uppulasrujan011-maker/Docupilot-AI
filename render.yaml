services:
  - type: web
    name: docupilot-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: FRONTEND_ORIGIN
        value: https://docupilot-ai-three.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data/docupilot.db
    disk:
      name: docupilot-data
      mountPath: /var/data
      sizeGB: 1
